# Meson Structure campaign — November 2026 — eic_xl:26.11-stable
#
# Self-contained: this one file is the full record of what runs where.
# Stages: Geant4 signal and pools, three TimeframeBuilder flavours, then (added
# 2026-11-05) EICrecon and eic2ai CSV on all four datasets.
#
# Per beam energy, 40,000 signal events = the first 500 events of the first 80
# afterburner files of campaign 2026-07 (one 500-event job per file):
#
#   npsim            K+ Lambda signal alone through Geant4        -> dd4hep/<E>
#   npsim_bgsource   each background source alone through Geant4 -> <bkg_dir>/pools/<E>/<source>
#   tfb_200ns        signal pinned at t = 0 in 200 ns frames      -> dd4hep-tfb200ns/<E>
#   tfb_2us          signal at a random crossing in 2 us frames   -> dd4hep-tfb2us/<E>
#   bkg_2us          background-only 2 us frames, 40,000 per E    -> <bkg_dir>/frames-2us/<E>
#
# The three frame flavours are TimeframeBuilder (EDM4hep mode, after Geant4)
# on the same per-source pools; stage 13 is run once per flavour with the
# block name as its first argument. ${base_dir}/bin/timeframe_builder is
# 0.9.2 built in this image from the fixed-time-offset branch with two
# patches: `fixed_time_offset` (pins the signal) and the EDM4hep
# `repeat_on_eof` fix (0.9.2 re-merges the stale last pool event with
# cumulative offsets once a pool is read past its end; every frame job here
# reads its pools several times).
#
# Cards for every stage are written by scripts/msf_2026_11_make_cards.sh.

base_dir: "/work/eic3/users/romanov/meson-structure-2026-11"
bkg_dir:  "/work/eic3/users/romanov/background-only-2026-11"
signal_2026_07: "/work/eic3/users/romanov/meson-structure-2026-07"   # afterburner input (reused)

container: "/cvmfs/singularity.opensciencegrid.org/eicweb/eic_xl:26.11-stable"
bind_dirs:
  - "${base_dir}"
  - "${bkg_dir}"
  - "${signal_2026_07}"
  - "/volatile/eic/EPIC/EVGEN/BACKGROUNDS"            # cocktail inputs
  - "/scratch"                                        # node-local staging of the csv stages

# Cocktail sources are root://dtn-eic.jlab.org//volatile/... URLs; on the farm
# the same files are mounted, so read them directly.
strip_xrootd_prefix: true

energies:
  - "5x41"
  - "9x100"
  - "9x130"
  - "9x275"

# Events per job: npsim takes the first 500 events of each input file; the
# frame stages make 500 frames per job (one signal file -> one job).
event_count: 500

# First 80 afterburner files per energy (sorted) = 40,000 events.
max_files_per_dataset: 80

# SLURM stdout/stderr base (admin requirement: never /work).
farm_out_dir: "/farm_out/romanov"
# 2 GB per CPU is the farm's provisioning; more bills extra CPUs.
slurm_mem_per_cpu: "2G"
# Standing self-imposed concurrency cap on every array (%16).
slurm_array_throttle: 16

datasets_dir: "${base_dir}/datasets"
slurm_files_per_job: 1

# ---- background cocktails (stages 23 and 13) ----------------------------------
# Closest-energy cocktail: the 10 GeV x N gold-coating 10 um + hadron-gas
# recipes for the 9 x N beams, the 5 x 41 vacuum + hadron-gas recipe for 5x41
# (its SynRad, Coulomb and Touschek inputs are the 5x100 files).
background_configs:
  "5x41":  "synrad_egasbrems_egascoulomb_egastouschek_hgas_5GeVx41GeV_vacuum_10000Ahr_machineruntime_50s.json"
  "9x100": "synrad_egasbrems_egascoulomb_egastouschek_hgas_10GeVx100GeV_GoldCoating_10um_10000Ahr_machineruntime_50s.json"
  "9x130": "synrad_egasbrems_egascoulomb_egastouschek_hgas_10GeVx130GeV_GoldCoating_10um_10000Ahr_machineruntime_50s.json"
  "9x275": "synrad_egasbrems_egascoulomb_egastouschek_hgas_10GeVx275GeV_GoldCoating_10um_10000Ahr_machineruntime_50s.json"

# Events in each cocktail input file (TTree entries), keyed by status; used
# for `pool_events: all` in stage 23. The 10xN counts were taken 2026-10-28,
# the 5x41 ones 2026-11-04.
background_pool_events:
  "9x100": {2000: 832375, 3000: 30000000, 4000: 1478187, 5000: 1167494, 6000: 10000000}
  "9x130": {2000: 832375, 3000: 30000000, 4000: 1478187, 5000: 1167494, 6000: 1000000}
  "9x275": {2000: 832375, 3000: 30000000, 4000: 1478187, 5000: 1167494, 6000: 10000000}
  # 5x41: the cocktail's SynRad 5x100, e-gas 5 GeV and p-gas 41 GeV inputs exist
  # neither on the farm nor on the public XRootD door (2026-11-04), so 5x41 has
  # signal only: no pools, no frames (frame_energies below).

# ---- per-dataset options (slug -> options read by stage 13) ------------------
# `pool_offset_jobs` keeps the three flavours from reading the same stretch of
# each pool.
datasets:
  msf_tfb200ns: {pool_offset_jobs: 0, slurm_mem_per_cpu: "8G"}    # eicrecon: 4 of 50 9x275 tasks OOM at 5G
  msf_tfb2us:  {pool_offset_jobs: 100, slurm_mem_per_cpu: "10G"}  # eicrecon memory (stage 30): 8 of 50
  bkg_2us:     {pool_offset_jobs: 200, background_only_jobs: 80,   # 9x275 tasks OOM at 5G x 2 CPUs;
                slurm_mem_per_cpu: "10G"}                           # 80 x 500 = 40,000 frames
  # control sample on the old merger path (stages 11 + 22, see below)
  msf_merger:  {pool_offset_jobs: 300}                              # one signal per 2 us frame
  bkg_merger:  {pool_offset_jobs: 400, signal_status: 7000, signal_freq: 0}   # ghost signal: shifted to
                                                                    # 7001/7002, never simulated by stage 22

# ---- stages ------------------------------------------------------------------

npsim:                                              # 20_create_npsim_jobs.py
  input:   "${signal_2026_07}/afterburner/${energy}-priority"
  pattern: "*.hepmc3.tree.root"
  output:  "${base_dir}/dd4hep/${energy}"
  jobs_per_file: 1                                  # first event_count events of each file
  slurm_mem_per_cpu: "4G"                           # 2.5 GB RSS measured (9x130 smoke job 14247195)

# Energies with background pools and frames (scripts/msf_2026_11_make_cards.sh).
frame_energies: ["9x100", "9x130", "9x275"]

npsim_bgsource:                                     # 23_create_npsim_bgsource_jobs.py
  energies: ${frame_energies}
  output:  "${bkg_dir}/pools/${energy}"             # + /<name>/<stem>.c<NNNN>.r<R>.edm4hep.root
  slurm_mem_per_cpu: "4G"                           # 2.5-3.2 GB RSS measured per source (9x130 smoke jobs)
  # pool_events = events through Geant4, sized for ~80k frame-equivalents of
  # 2 us (40k background-only + 40k signal frames; the 200 ns frames add 4k)
  # with a 1.2 margin; TimeframeBuilder wraps the pool with repeat_on_eof.
  # SynRad: the whole file is only ~31 frame-equivalents, so every frame beyond
  # that re-pastes the same photons; 2 replicas (different Geant4 seeds)
  # double the distinct material at the cost of ~1.7 M photon events.
  sources:
    2000: {name: synrad,   pool_events: all,    events_per_job: 50000, replicas: 2}
    3000: {name: egas,     pool_events: 600000, events_per_job: 20000}
    4000: {name: coulomb,  pool_events: 6000,   events_per_job: 1000}
    5000: {name: touschek, pool_events: 50000,  events_per_job: 1000}
    6000: {name: pgas,     pool_events: 7000,   events_per_job: 1000}

tfb_200ns:                                          # 13_create_timeframe_builder_jobs.py tfb_200ns
  input:   "${npsim.output}"
  pattern: "*.edm4hep.root"
  output:  "${base_dir}/dd4hep-tfb200ns/${energy}"
  pools:   "${npsim_bgsource.output}"
  # 200 ns (about 20 crossings) keeps the prompt far-forward signal: B0 at
  # 19-25 ns, Off-Momentum 85-91 ns, Roman Pots 108-116 ns, ZDC from 119 ns
  # (99.3 % of signal tracker hits within t0 + 200 ns). 70 ns would keep the
  # central detector and B0 only.
  frame_ns: 200
  signal_time_ns: 0                                 # signal pinned at the frame start
  frames_per_job: 500                               # = events per signal file
  jobs_per_file: 1
  bunch_crossing: true
  bunch_crossing_period_ns: 10.15                   # 98.5 MHz (CDR)
  attach_to_beam: true
  tfb_binary: "${base_dir}/bin/timeframe_builder"   # 0.9.2 + fixed_time_offset + repeat_on_eof fix
  slurm_mem_per_cpu: "3G"                           # 1.7-2.0 GB RSS measured (9x130 smoke, 2 us frames)

tfb_2us:                                            # 13_create_timeframe_builder_jobs.py tfb_2us
  input:   "${npsim.output}"
  pattern: "*.edm4hep.root"
  output:  "${base_dir}/dd4hep-tfb2us/${energy}"
  pools:   "${npsim_bgsource.output}"
  frame_ns: 2000
  signal_time_ns: null                              # random crossing, as in the ePIC campaigns
  frames_per_job: 500
  jobs_per_file: 1
  bunch_crossing: true
  bunch_crossing_period_ns: 10.15
  attach_to_beam: true
  tfb_binary: "${base_dir}/bin/timeframe_builder"
  slurm_mem_per_cpu: "3G"                           # 1.7-2.0 GB RSS measured (9x130 smoke, 2 us frames)

bkg_2us:                                            # 13_create_timeframe_builder_jobs.py bkg_2us
  output:  "${bkg_dir}/frames-2us/${energy}"        # cards: --empty (no signal source)
  pools:   "${npsim_bgsource.output}"
  frame_ns: 2000
  frames_per_job: 500
  background_only_jobs: 80
  bunch_crossing: true
  bunch_crossing_period_ns: 10.15
  attach_to_beam: true
  tfb_binary: "${base_dir}/bin/timeframe_builder"
  slurm_mem_per_cpu: "3G"                           # 1.7-2.0 GB RSS measured (9x130 smoke, 2 us frames)

# ---- control sample: the old merger path (added 2026-11-05, "run empty 2 us
# frames and msf simulations (only dd4hep) using the old frame builder and make
# plots comparing the results"; 9x100 and 9x275, 20,000 frames each) --------
# SignalBackgroundMerger mixes the afterburner HepMC signal with the cocktail
# into 2 us frames BEFORE Geant4 (status offsets on generator particles only),
# then npsim simulates whole frames. The same first 40 signal files x 500
# events as the TimeframeBuilder flavours, so the two paths hold the same
# signal events. Whole-frame npsim measured 2026-06: ~11 s per 2 us frame
# (5,000 frames in 15-16 h), so 500 frames per job is ~1.6 h.
merger_energies: ["9x100", "9x275"]

bg_merger:                                          # 11_create_background_jobs.py
  pattern: "*.hepmc3.tree.root"                     # cards: --input-dir <afterburner/E-priority> --max-files 40
  output:  "${base_dir}/bg_merged/${energy}/${slug}"
  jobs_per_file: 1                                  # 500 frames from the first 500 events of each file
  slurm_mem_per_cpu: "3G"

npsim_background:                                   # 22_create_npsim_background_jobs.py
  pattern: "*.bg.hepmc3.tree.root"
  output:  "${base_dir}/dd4hep-merger/${energy}"    # msf_merger; bkg_merger card -> ${bkg_dir}/frames-2us-merger/${energy}
  slurm_mem_per_cpu: "4G"                           # TODO from the smoke test

# ---- reconstruction and CSV (added 2026-11-05: "reconstruction and eic2ai CSV of
# everything in this campaign") -------------------------------------------------
# Four input datasets per energy go through EICrecon; their cards are made with
# --input-dir/--output-dir (make_cards.sh), one slug per dataset:
#   msf_signal    dd4hep/<E>            -> reco/<E>
#   msf_tfb200ns  dd4hep-tfb200ns/<E>   -> reco-tfb200ns/<E>
#   msf_tfb2us    dd4hep-tfb2us/<E>     -> reco-tfb2us/<E>
#   bkg_2us       <bkg_dir>/frames-2us  -> <bkg_dir>/reco-2us/<E>
# EICrecon 1.43.0 (this image) seeds B0 tracks from Geant4 secondaries by
# default (EICrecon PR #2901, B0TrackerTruthSeeds with maxVertexZ 6 m), so the
# 2026-07 truth-seeding flags are not needed.
eicrecon:                                           # 30_create_eicrecon_jobs.py
  pattern: "*.edm4hep.root"
  output:  "${base_dir}/reco/${energy}"             # overridden per card
  slurm_mem_per_cpu: "5G"                           # smoke: 3.1 GB RSS signal, 4.3 GB 200 ns frames, 3.9 GB 2 us frames
  # wall per 500: signal 6 min, 200 ns frames 12 min, 2 us frames 35-45 min (smoke 2026-11-05)

# CSV via eic2ai (one program call per file pair, every role in one pass),
# built in this image from the pipeline's eic2ai submodule (f6f6b09).
converter: "eic2ai"
eic2ai_bin: "/w/eic-scshelf2104/users/romanov/meson-structure-work/meson-structure/simulation-pipeline/eic2ai/build-eic_xl-26.11/eic2ai"
eic2ai_args: ""
# Inputs are staged to node-local disk: a 2 us reco + sim pair is up to ~8 GB.
slurm_tmp_disk: "40G"
staging_headroom_gb: 5

# Every role for the signal and the 200 ns frames (events and found-event
# windows); the 2 us flavours skip mc_particles (37M rows per 500-frame file).
csv_signal:                                         # 40_csv_convert.py csv_signal
  input:   "${base_dir}/reco/${energy}"
  pattern: "*.edm4eic.root"
  paired:
    dir:    "${base_dir}/dd4hep/${energy}"
    suffix: ".edm4hep.root"
  output:  "${base_dir}/csv-reco/${energy}"
  slurm_mem_per_cpu: "3G"                           # eic2ai 0.9 GB on a 500-event pair
  roles: &all_roles
    - event_index
    - mc_particles
    - mc_dis
    - mcpart_lambda
    - trk_hits
    - cal_hits
    - calo_clusters
    - reco_particles
    - reco_dis
    - reco_ff_lambda
    - lambda_acceptance
    - comb_candidates
    - acceptance_ppim
    - acceptance_npi0
    - combinatorics_ppim

csv_tfb200ns:                                       # 40_csv_convert.py csv_tfb200ns
  input:   "${base_dir}/reco-tfb200ns/${energy}"
  pattern: "*.edm4eic.root"
  paired:
    dir:    "${base_dir}/dd4hep-tfb200ns/${energy}"
    suffix: ".edm4hep.root"
  output:  "${base_dir}/csv-tfb200ns/${energy}"
  slurm_mem_per_cpu: "6G"                           # eic2ai ~5 GB on a 200 ns pair
  roles: *all_roles

csv_tfb2us:                                         # 40_csv_convert.py csv_tfb2us
  input:   "${base_dir}/reco-tfb2us/${energy}"
  pattern: "*.edm4eic.root"
  paired:
    dir:    "${base_dir}/dd4hep-tfb2us/${energy}"
    suffix: ".edm4hep.root"
  output:  "${base_dir}/csv-tfb2us/${energy}"
  slurm_mem_per_cpu: "8G"                           # TODO from the eic2ai retest on a 2 us pair
  roles: &frame_roles
    - event_index
    - mc_dis
    - mcpart_lambda
    - trk_hits
    - cal_hits
    - calo_clusters
    - reco_particles
    - reco_dis
    - reco_ff_lambda
    - lambda_acceptance
    - comb_candidates
    - acceptance_ppim
    - acceptance_npi0
    - combinatorics_ppim

csv_bkg2us:                                         # 40_csv_convert.py csv_bkg2us
  input:   "${bkg_dir}/reco-2us/${energy}"
  pattern: "*.edm4eic.root"
  paired:
    dir:    "${bkg_dir}/frames-2us/${energy}"
    suffix: ".edm4hep.root"
  output:  "${bkg_dir}/csv-2us/${energy}"
  slurm_mem_per_cpu: "8G"                           # TODO from the eic2ai retest on a 2 us pair
  roles: *frame_roles
